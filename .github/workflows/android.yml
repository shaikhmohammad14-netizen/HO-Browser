name: Build HO Browser APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          
         gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract HO Browser project
        run: 
      - name: Extract HO Browser project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d .




      - name: Build APK
        run: gradle --no-daemon -p ho-browser assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HO-Browser-debug
          path: ho-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
